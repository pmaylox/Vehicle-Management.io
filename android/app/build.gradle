plugins {
    id 'com.android.application'
}

android {
    namespace 'io.reddirtcode.milesage'
    compileSdk 35

    defaultConfig {
        applicationId 'io.reddirtcode.milesage.alpha134'
        minSdk 26
        targetSdk 35
        versionCode 134
        versionName '1.3.4-alpha-test'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
