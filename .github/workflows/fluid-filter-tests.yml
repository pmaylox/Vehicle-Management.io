name: MileSage feature regression checks

on:
  push:
    branches:
      - feature/alpha-1.2.0-fluid-checks
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export dependency
        run: python -m pip install openpyxl
      - name: Check Python syntax
        run: python -m compileall -q Vehicle_Manager.py app.py excel_export.py storage.py test_fluid_filters.py
      - name: Run fluid/filter and export regression tests
        run: python -m unittest -v test_fluid_filters.py
      - name: Exercise phone restore safety checks
        run: node mobile/test_restore_safety.cjs
      - name: Test service photo OCR parser
        run: node mobile/test_receipt_parser.cjs
      - name: Validate phone JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("mobile/MileSage_Mobile_Auto_Refresh.html").read_text(encoding="utf-8")
          Path("/tmp/milesage-mobile.js").write_text(text.split("<script>", 1)[1].split("</script>", 1)[0], encoding="utf-8")
          PY
          node --check /tmp/milesage-mobile.js
