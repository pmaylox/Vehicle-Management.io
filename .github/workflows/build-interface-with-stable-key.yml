name: Build signed MileSage 1.4.10 interface candidate
on:
  push:
    branches: [fix/fuel-gallery-native-ocr-save-alpha1410-20261124]
    paths: [.github/workflows/build-interface-with-stable-key.yml]
  workflow_dispatch:

jobs:
  build:
    concurrency:
      group: milesage-alpha1410-${{ github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Immutable interface source; branch context retains the established signing cache.
          ref: 0b6f000245a44575b9c005434f787cd78423616e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore stable repair-test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: milesage-alpha142-debug-signing-v1
      - name: Prepare SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Cache Gradle dependency downloads for expense-scanner builds
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: milesage-alpha142-gradle-dependencies-${{ runner.os }}-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build matching standalone HTML and Android assets
        run: |
          mkdir -p android/app/src/main/assets release
          cp mobile/MileSage_Alpha_1_3_2_VIN_Lookup.html android/app/src/main/assets/index.html
          sed -i 's/Alpha 1.3.2/Alpha 1.4.10 Interface Test/g' android/app/src/main/assets/index.html
          cp android/app/src/main/assets/index.html release/MileSage_Alpha_1_4_10_Interface_Test.html
          printf '%s\n' "MileSage Alpha 1.4.10 - fuel photo OCR repair, manual save fallback, approved Red Dirt Code MS + braces launcher icon; preserves Alpha 1.4.8 PDF autofill diagnostics and unambiguous TOTAL labels, reusable backup browser and Fuel/Service/Expense scanners" \
            "Do NOT uninstall or clear existing MileSage apps. Back up every current installation before updating." \
            "Back up your existing phone data before importing anything into the test copy." \
            "This candidate retains the alpha1410fueltest package ID with version code 151. It can update that package only when the signing certificate matches. Older package IDs remain separate. Do not uninstall to bypass a signing mismatch." \
            "Use Data & backup > Import JSON file with YOUR full phone backup." \
            "Data & backup > Saved backups & snapshots lists local undo copies and offers Browse saved JSON files in Downloads/MileSage. Restoring does not delete downloaded JSON. The three most recent app-local snapshots are retained." \
            "Confirm the real Tacoma and Explorer plus their histories after import." \
            "The Fuel and Service receipt buttons each open a one-page crop-and-straighten document scanner, with native offline OCR and editable suggestions. The independent Service multi-page PDF scanner remains available." \
            "Expenses > Scan multi-page document produces a 30-page PDF and recognizes dates, invoice totals and body repair descriptions for confirmation. View the PDF before saving the expense." \
            "The separate Service scanner still supports up to 30 invoice pages." \
            "Expenses > Load PDF reads imported 1-30 page PDFs with local OCR and suggests expense date, total and description without replacing user-entered values." \
            "Unambiguous TOTAL amounts are suggested. PDF OCR status appears near the expense fields. Only Save other expense adds to history." \
            "For expense PDF files: tap Save PDF to My Files; Samsung My Files > Downloads > MileSage > Expenses. Full mobile JSON backups include PDF references, NOT PDF bytes." \
            "Test with disposable Expense, Service and Fuel records first; preserve original MileSage." \
            "This APK is DEBUG-SIGNED for testing and not for production distribution." \
            "OCR, PDF opening/sharing and attachments require Samsung phone testing." > release/READ_ME_FIRST.txt
      - name: Validate JavaScript and mobile regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          assert s.rstrip().endswith("</body></html>"), "Unexpected trailing content after HTML document"
          for phrase in ("mobile_photo","chooseVehiclePhoto","takeVehiclePhoto","removeVehiclePhoto","milesage-mobile-offline-v1","+ By VIN","Take receipt photo","Take fuel receipt photo","choosePhotoDir","odometer-controls","receipt_photo",'id="editVehicle"','id="removeVehicle"','id="scanServicePdf"','function parseGallonsInput(','FUEL_SCANNER_V2_BEGIN','window.milesageFuelScanComplete','window.milesageServiceReceiptComplete','EXPENSE_MULTIPAGE_PDF_BEGIN','EXPENSE_PDF_OCR_BEGIN','window.milesageExpenseOCRComplete','REUSABLE_BACKUP_LIBRARY_BEGIN','id="savedBackupLibrary"','BETA2_RESALE_FEEDBACK_BEGIN','id="loadExpensePdf"','id="viewExpensePdfDraft"','window.milesageExpenseScannerComplete'):
              assert phrase in s, phrase
          Path("/tmp/milesage-inline.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/milesage-inline.js
          node mobile/test_restore_safety.cjs
          node mobile/test_car_history.cjs
          node mobile/test_backup_library.cjs
          node mobile/test_beta2_resale_feedback.cjs
          node mobile/test_expense_pdf_file_import.cjs
          node mobile/test_vin_lookup.cjs
          node mobile/test_vehicle_management.cjs
          node mobile/test_vehicle_photos.cjs
          node mobile/test_service_pdf_scanner.cjs
          node mobile/test_service_cancel_layout.cjs
          node mobile/test_evening_insights.cjs
          node mobile/test_receipt_parser.cjs
          node mobile/test_fuel_receipt_parser.cjs
          node mobile/test_fuel_scanner_v2.cjs
          node mobile/test_fuel_gallery_save.cjs
          node mobile/test_service_receipt_scanner_v2.cjs
          node mobile/test_expense_multipage_pdf.cjs
          node mobile/test_expense_pdf_ocr.cjs
          python mobile/validate_mobile_html.py
          python -m unittest -v test_mobile_html_validation
          node mobile/test_odometer_controls.cjs
          node mobile/test_receipt_folder.cjs
      - name: Build installable debug APK with limited dependency traffic
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "APK compilation failed after three attempts."
              exit 1
            fi
            echo "Dependency download may be rate-limited; retrying."
            sleep "$((attempt * 20))"
          done
      - name: Collect build files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MileSage_Alpha_1_4_10_Interface_Test.apk
          python mobile/validate_mobile_html.py release/MileSage_Alpha_1_4_10_Interface_Test.apk
          unzip -t release/MileSage_Alpha_1_4_10_Interface_Test.apk | tail -1
          sha256sum release/MileSage_Alpha_1_4_10_Interface_Test.apk > release/APK_SHA256.txt
      - name: Check APK signature and distinct test package ID
        run: |
          APK=release/MileSage_Alpha_1_4_10_Interface_Test.apk
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release/SIGNING_CERTIFICATE.txt
          grep -F "certificate SHA-256 digest: d6ae82179d2b2e382686f1f73380e49add074b8c1ce06ecf5ec410f6c92c4932" release/SIGNING_CERTIFICATE.txt
          PACKAGE="$("${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:')"
          echo "$PACKAGE"
          echo "$PACKAGE" | grep -F "name='io.reddirtcode.milesage.alpha1410fueltest'"
      - name: Test complete app in a phone-sized browser
        run: |
          npm install --no-save playwright@1.65.1
          if command -v google-chrome >/dev/null 2>&1; then
            export MILESAGE_CHROME="$(command -v google-chrome)"
            echo "Using runner-provided Chrome; no apt dependency downloads."
          elif command -v chromium >/dev/null 2>&1; then
            export MILESAGE_CHROME="$(command -v chromium)"
            echo "Using runner-provided Chromium."
          else
            npx playwright install chromium
          fi
          node mobile/test_interface_browser.cjs
          node mobile/test_browser_runtime.cjs mobile/MileSage_Mobile_Auto_Refresh.html mobile/MileSage_Alpha_1_3_2_VIN_Lookup.html android/app/src/main/assets/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: MileSage-Alpha-1.4.10-Interface-Test
          path: release/
          retention-days: 90
