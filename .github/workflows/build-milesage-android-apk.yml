name: Build MileSage Alpha 1.3.6 All Updates Test APK
on:
  push:
    branches:
      - feature/milesage-all-updates-apk-20261117
    paths:
      - "android/**"
      - "mobile/**"
      - ".github/workflows/build-milesage-android-apk.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build matching standalone HTML and Android assets
        run: |
          mkdir -p android/app/src/main/assets release
          cp mobile/MileSage_Alpha_1_3_2_VIN_Lookup.html android/app/src/main/assets/index.html
          sed -i 's/Alpha 1.3.2/Alpha 1.3.6 All Updates Test/g' android/app/src/main/assets/index.html
          cp android/app/src/main/assets/index.html release/MileSage_Alpha_1_3_6_All_Updates_Test.html
          printf '%s\n' "MileSage Alpha 1.3.6 - separate Android ALL UPDATES TEST build" \
            "Do NOT uninstall or clear the original MileSage APK; this is a separately installed TEST copy." \
            "Back up your existing phone data before importing anything into the test copy." \
            "The APK uses a new app ID and stores data SEPARATELY from the previously installed MileSage APK." \
            "Use Data & backup > Import JSON file with YOUR full phone backup." \
            "Confirm the real Tacoma and Explorer plus their histories after import." \
            "This build combines Service-only multi-page PDF scanning with fixed Fuel autofill and 3-decimal US gallons." \
            "Scan up to 30 service invoice pages; the scanner makes one PDF." \
            "Tap Share / backup PDF in Service history; JSON backups do not include PDF bytes." \
            "Test with disposable Service and Fuel records first; preserve original MileSage." \
            "This APK is DEBUG-SIGNED for testing and not for production distribution." \
            "Scanning, PDF opening/sharing and attachments require manual phone testing." > release/READ_ME_FIRST.txt
      - name: Validate JavaScript and mobile regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          assert s.rstrip().endswith("</body></html>"), "Unexpected trailing content after HTML document"
          for phrase in ("mobile_photo","chooseVehiclePhoto","takeVehiclePhoto","removeVehiclePhoto","milesage-mobile-offline-v1","+ By VIN","Take receipt photo","Take fuel receipt photo","choosePhotoDir","odometer-controls","receipt_photo",'id="editVehicle"','id="removeVehicle"','id="scanServicePdf"','function parseGallonsInput('):
              assert phrase in s, phrase
          Path("/tmp/milesage-inline.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/milesage-inline.js
          node mobile/test_restore_safety.cjs
          node mobile/test_vin_lookup.cjs
          node mobile/test_vehicle_management.cjs
          node mobile/test_vehicle_photos.cjs
          node mobile/test_service_pdf_scanner.cjs
          node mobile/test_evening_insights.cjs
          node mobile/test_receipt_parser.cjs
          node mobile/test_fuel_receipt_parser.cjs
          node mobile/test_odometer_controls.cjs
          node mobile/test_receipt_folder.cjs
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect build files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MileSage_Alpha_1_3_6_All_Updates_Test.apk
          unzip -t release/MileSage_Alpha_1_3_6_All_Updates_Test.apk | tail -1
          sha256sum release/MileSage_Alpha_1_3_6_All_Updates_Test.apk > release/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MileSage-Alpha-1.3.6-All-Updates-Test
          path: release/
          retention-days: 90
