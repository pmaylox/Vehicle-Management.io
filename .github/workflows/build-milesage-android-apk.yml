name: Build MileSage Android APK and current HTML
on:
  push:
    branches:
      - build/android-apk-alpha-1.3.3
    paths:
      - "android/**"
      - "mobile/**"
      - ".github/workflows/build-milesage-android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build matching standalone HTML and Android assets
        run: |
          mkdir -p android/app/src/main/assets release
          cp mobile/MileSage_Alpha_1_3_2_VIN_Lookup.html android/app/src/main/assets/index.html
          sed -i 's/Alpha 1.3.2/Alpha 1.3.3/g' android/app/src/main/assets/index.html
          cp android/app/src/main/assets/index.html release/MileSage_Alpha_1_3_3_All_Updates.html
          printf '%s\n' "MileSage Alpha 1.3.3 - Android APK trial build" \
            "Back up your existing phone data before installing." \
            "The APK stores data separately from the earlier browser HTML." \
            "Use Data & backup > Import JSON file with YOUR full phone backup." \
            "Check real Tacoma, Explorer, and test Tacoma before editing." \
            "This is an unsigned-for-production, debug-signed alpha APK." \
            "Receipt camera and folder saving require manual phone testing." > release/READ_ME_FIRST.txt
      - name: Validate JavaScript and mobile regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          for phrase in ("milesage-mobile-offline-v1","+ By VIN","Take receipt photo","Take fuel receipt photo","choosePhotoDir","odometer-controls","receipt_photo"):
              assert phrase in s, phrase
          Path("/tmp/milesage-inline.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/milesage-inline.js
          node mobile/test_restore_safety.cjs
          node mobile/test_vin_lookup.cjs
          node mobile/test_evening_insights.cjs
          node mobile/test_receipt_parser.cjs
          node mobile/test_fuel_receipt_parser.cjs
          node mobile/test_odometer_controls.cjs
          node mobile/test_receipt_folder.cjs
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect build files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MileSage-Alpha-1.3.3-Android.apk
          unzip -t release/MileSage-Alpha-1.3.3-Android.apk | tail -1
          sha256sum release/MileSage-Alpha-1.3.3-Android.apk > release/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MileSage-Alpha-1.3.3-Android-APK-and-HTML
          path: release/
          retention-days: 90
