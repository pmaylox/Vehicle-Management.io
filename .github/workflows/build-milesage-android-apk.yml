name: Build MileSage Alpha 1.4.0 Fuel Scanner APK
on:
  push:
    branches:
      - feature/fuel-scanner-rebuild-alpha140-20261118
      - feature/milesage-all-updates-apk-20261117
      - codex/mobile-repair-audit
    paths:
      - "android/**"
      - "mobile/**"
      - ".github/workflows/build-milesage-android-apk.yml"
  pull_request:
    branches: [main, fix/alpha139-fuel-ocr-arithmetic-autofill-20261117]
  workflow_dispatch:

jobs:
  build:
    concurrency:
      group: milesage-alpha140-debug-signing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore stable repair-test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: milesage-alpha140-debug-signing-v1
      - name: Prepare SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build matching standalone HTML and Android assets
        run: |
          mkdir -p android/app/src/main/assets release
          cp mobile/MileSage_Alpha_1_3_2_VIN_Lookup.html android/app/src/main/assets/index.html
          sed -i 's/Alpha 1.3.2/Alpha 1.4.0 Fuel Scanner/g' android/app/src/main/assets/index.html
          cp android/app/src/main/assets/index.html release/MileSage_Alpha_1_4_0_Fuel_Scanner.html
          printf '%s\n' "MileSage Alpha 1.4.0 - bundled offline OCR for Fuel, Service and Expense photos with field suggestions and full backup" \
            "Do NOT uninstall or clear existing MileSage apps. This separately installed test copy has independent storage." \
            "Back up your existing phone data before importing anything into the test copy." \
            "This APK has its own application ID and cannot overwrite previous MileSage test apps. Import a Full mobile backup to copy data into it." \
            "Use Data & backup > Import JSON file with YOUR full phone backup." \
            "Confirm the real Tacoma and Explorer plus their histories after import." \
            "This build adds offline native text recognition for Fuel, Service and Expense receipts, and retains photo persistence and Service-only multi-page PDF scanning." \
            "Scan up to 30 service invoice pages; the scanner makes one PDF." \
            "Tap Share / backup PDF in Service history; JSON backups do not include PDF bytes." \
            "Test with disposable Expense, Service and Fuel records first; preserve original MileSage." \
            "This APK is DEBUG-SIGNED for testing and not for production distribution." \
            "OCR, PDF opening/sharing and attachments require Samsung phone testing." > release/READ_ME_FIRST.txt
      - name: Validate JavaScript and mobile regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          assert s.rstrip().endswith("</body></html>"), "Unexpected trailing content after HTML document"
          for phrase in ("mobile_photo","chooseVehiclePhoto","takeVehiclePhoto","removeVehiclePhoto","milesage-mobile-offline-v1","+ By VIN","Take receipt photo","Take fuel receipt photo","choosePhotoDir","odometer-controls","receipt_photo",'id="editVehicle"','id="removeVehicle"','id="scanServicePdf"','function parseGallonsInput(','FUEL_SCANNER_V2_BEGIN','window.milesageFuelScanComplete'):
              assert phrase in s, phrase
          Path("/tmp/milesage-inline.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/milesage-inline.js
          node mobile/test_restore_safety.cjs
          node mobile/test_vin_lookup.cjs
          node mobile/test_vehicle_management.cjs
          node mobile/test_vehicle_photos.cjs
          node mobile/test_service_pdf_scanner.cjs
          node mobile/test_service_cancel_layout.cjs
          node mobile/test_evening_insights.cjs
          node mobile/test_receipt_parser.cjs
          node mobile/test_fuel_receipt_parser.cjs
          node mobile/test_fuel_scanner_v2.cjs
          python mobile/validate_mobile_html.py
          python -m unittest -v test_mobile_html_validation
          node mobile/test_odometer_controls.cjs
          node mobile/test_receipt_folder.cjs
      - name: Test complete app in a phone-sized browser
        run: |
          npm install --no-save playwright@1.65.1
          npx playwright install --with-deps chromium
          node mobile/test_browser_runtime.cjs mobile/MileSage_Mobile_Auto_Refresh.html mobile/MileSage_Alpha_1_3_2_VIN_Lookup.html android/app/src/main/assets/index.html
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect build files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MileSage_Alpha_1_4_0_Fuel_Scanner.apk
          python mobile/validate_mobile_html.py release/MileSage_Alpha_1_4_0_Fuel_Scanner.apk
          unzip -t release/MileSage_Alpha_1_4_0_Fuel_Scanner.apk | tail -1
          sha256sum release/MileSage_Alpha_1_4_0_Fuel_Scanner.apk > release/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MileSage-Alpha-1.4.0-Rebuilt-Fuel-Scanner
          path: release/
          retention-days: 90
